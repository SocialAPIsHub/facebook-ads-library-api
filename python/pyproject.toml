[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "facebook-ads-library-api"
dynamic = ["version"]
description = "Meta (Facebook) Ads Library API for Python: search ads by keyword or advertiser, paginate, export to CSV. No Meta app review."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SocialAPIs", email = "pypi@socialapis.io" }]
license = { text = "MIT" }
keywords = [
    "facebook-ads-library",
    "meta-ads-library",
    "ads-library-api",
    "facebook-ads",
    "instagram-ads",
    "ad-library",
    "competitor-ads",
    "ad-spy",
    "facebook-api",
    "socialapis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = ["socialapis-sdk>=0.1.3"]

[project.scripts]
facebook-ads-library = "facebook_ads_library_api.cli:main"

[project.urls]
Homepage = "https://socialapis.io"
Documentation = "https://socialapis.io/api-sources/meta-ads-search"
Guide = "https://socialapis.io/blog/facebook-ads-library-api"
Pricing = "https://socialapis.io/pricing"
"Free ad checker" = "https://socialapis.io/tools/facebook-ad-checker"
Repository = "https://github.com/SocialAPIsHub/facebook-ads-library-api"
Issues = "https://github.com/SocialAPIsHub/facebook-ads-library-api/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "facebook_ads_library_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["facebook_ads_library_api"]

[tool.hatch.build.targets.sdist]
include = ["/facebook_ads_library_api", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
